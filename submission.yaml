submission:
  title: "SmartSupply AI – Supply Chain Disruption Assistant"    # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Supply chain disruptions caused by weather events, port strikes, and geopolitical crises can affect hundreds of shipments at the same time. It is difficult to track these disruptions manually, while some fleet assets remain idle and other routes become overloaded. Cold-chain shipments are 
    especially vulnerable because temperature excursions can spoil valuable cargo,and these problems may only be discovered at delivery.Our goal is to build a Supply Chain Disruption Assistant that identifies affected shipments, recommends alternative routes or carriers, finds idle fleet assets for redeployment, and detects cold-chain temperature excursions before delivery.


  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
        SmartSupply AI is a supply chain disruption assistant that analyses shipment and fleet information to identify disrupted or delayed shipments and prioritise them based on risk. It detects cold-chain temperature excursions, identifies idle fleet assets for redeployment, and recommends alternative routes or carriers for affected shipments. The solution provides clear recommendations to help reduce delays, protect sensitive cargo, and improve fleet utilisation. 
    key_features:
  - "Shipment disruption and delay detection"
  - "Risk scoring and priority classification"
  - "Alternative route and carrier recommendations"
  - "Idle fleet asset identification and redeployment"
  - "Cold-chain temperature excursion detection"
  
    tech_stack:
  - "C++"
  - "C++ Standard Library"
  - "GitHub"
  - "IBM Bob"
  

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
   We are most proud of creating a simple and practical solution to a real-world supply chain problem. SmartSupply AI combines shipment risk detection, cold-chain monitoring, fleet utilisation, and actionable recommendations in one solution, making complex supply chain problems easier to understand and manage.


  known_limitations: >                 # Optional but recommended — be honest about gaps
    known_limitations:
  - "The current prototype uses manually entered shipment and fleet data."
  - "Real-time weather, GPS, and IoT sensor data are not yet connected."
  - "Route recommendations are based on predefined logic rather than live traffic or logistics data."
  - "The current risk-scoring system uses rule-based calculations and can be improved with machine learning."
  - "The prototype is currently a command-line C++ application and does not yet have a web dashboard."

